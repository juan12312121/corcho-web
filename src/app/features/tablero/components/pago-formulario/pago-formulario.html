<app-modal [abierto]="abierto()" titulo="Registrar pago" subtitulo="Dinero que se pasaron entre ustedes" icono="payments" (cerrar)="cerrar.emit()">
  <form id="form-pago" class="formulario" [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
    <div class="flujo">
      <app-campo etiqueta="Paga">
        <select formControlName="deUsuarioId">
          @for (m of miembros(); track m.usuarioId) {
            <option [value]="m.usuarioId">{{ nombre(m) }}</option>
          }
        </select>
      </app-campo>
      <span class="flecha" aria-hidden="true"><app-icono nombre="arrow_forward" [tamano]="26" /></span>
      <app-campo etiqueta="Recibe">
        <select formControlName="aUsuarioId">
          <option value="" disabled>Elige…</option>
          @for (m of miembros(); track m.usuarioId) {
            <option [value]="m.usuarioId">{{ nombre(m) }}</option>
          }
        </select>
      </app-campo>
    </div>

    @if (de() && a()) {
      <div class="personas" aria-hidden="true">
        <app-avatar [persona]="de()!" [tamano]="44" />
        <span class="linea"></span>
        <app-avatar [persona]="a()!" [tamano]="44" />
      </div>
    }

    @if (cuentaDestino(); as cuenta) {
      <app-datos-transferencia [cuenta]="cuenta" />
    }

    <app-campo etiqueta="Monto ({{ moneda() }})">
      <input formControlName="monto" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" />
    </app-campo>

    <app-control-segmentado etiqueta="Método de pago" [opciones]="metodos" formControlName="metodo" />

    <app-campo etiqueta="Concepto" [opcional]="true">
      <input formControlName="concepto" maxlength="200" placeholder="Mi parte del súper" />
    </app-campo>

    @if (quedaPendiente() && a()) {
      <p class="nota-info"><app-icono nombre="info" [tamano]="18" /> Quedará pendiente hasta que {{ nombre(a()!) }} confirme que le llegó.</p>
    }
    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
  </form>

  <ng-container pie>
    <button appBoton type="button" variante="fantasma" (click)="cerrar.emit()">Cancelar</button>
    <button appBoton type="submit" form="form-pago" variante="primario" icono="check" [cargando]="enviando()">Registrar pago</button>
  </ng-container>
</app-modal>
